# @package _global_
defaults:
  - /pipeline: selective_copying
  - /model: s4

dataset:
  l_noise: 4096
  l_memorize: 16
  n_tokens: 16
  variable: true
  variable_length: false
  static: false
  n_train: 10000
  n_eval: 1000

model:
  dropout: 0.0
  n_layers: 2
  d_model: 128
  prenorm: true
  layer:
    deterministic: false
    dt_min: 0.001
    dt_max: 0.1
    d_state: 128
    lr: 0.0001

loader:
  batch_size: 64

optimizer:
  lr: 0.0001
  weight_decay: 0.0

trainer:
  devices: [0]
  max_steps: 400000
  max_epochs: 1000

train:
  seed: 2222
  remove_test_loader_in_eval: true

wandb:
  name: synthetic/s4-selective-copying
