# @package _global_
defaults:
  - /pipeline: local_window_copying
  - /model: s4

dataset:
  l_seq: 4096
  l_window_min: 64
  l_window_max: 128
  query_length: 1
  dt: 0.001
  freq: 20.0
  static: false
  n_train: 10000
  n_eval: 1000

model:
  dropout: 0.0
  n_layers: 2
  d_model: 128
  prenorm: true
  layer:
    deterministic: false
    dt_min: 0.001
    dt_max: 0.1
    d_state: 128
    lr:
      A: 0.0001
      B: 0.0001
      dt: 0.0001
    # My args
    mode: frame
    init: safari_gabors # Options: hippo_legs, safari_legs, safari_gabors


loader:
  batch_size: 64

optimizer:
  lr: 0.001
  weight_decay: 0.0

trainer:
  devices: [0]
  max_steps: 400000
  max_epochs: 1000

train:
  seed: 3333
  remove_test_loader_in_eval: true

wandb:
  name: synthetic/s4-local-window-copying
