# @package _global_
defaults:
  - /pipeline: ptbxl
  - /model: s4
  - override /scheduler: cosine_warmup

model:
  dropout: 0.1
  n_layers: 6
  d_model: 256
  prenorm: true
  norm: batch
  layer:
    d_state: 64
    bidirectional: true
    final_act: glu
    n_ssm: null

loader:
  batch_size: 16

optimizer:
  lr: 0.01
  weight_decay: 0.05

trainer:
  max_epochs: 100

scheduler:
  num_training_steps: 55000
  num_warmup_steps: 5000

train:
  seed: 5555

